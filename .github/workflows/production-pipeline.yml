name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Production Changes
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.scope.outputs.database }}
      functions: ${{ steps.scope.outputs.functions }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve deployment scopes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          database=false
          functions=false
          frontend=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            database=true
            functions=true
            frontend=true
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # Unknown comparison base must never suppress a required deployment.
            database=true
            functions=true
            frontend=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                supabase/migrations/*)
                  database=true
                  ;;
                supabase/functions/*|supabase/config.toml)
                  functions=true
                  ;;
                app/*|public/*|src/*|next.config.mjs|open-next.config.ts|wrangler.jsonc|package.json|package-lock.json)
                  frontend=true
                  ;;
                .github/workflows/production-pipeline.yml)
                  # The production pipeline itself must be publishable without
                  # forcing a database migration when only CI orchestration changes.
                  frontend=true
                  ;;
                .github/workflows/*)
                  database=true
                  functions=true
                  frontend=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BEFORE_SHA" "$CURRENT_SHA")
          fi

          {
            echo "database=$database"
            echo "functions=$functions"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      production_safe_smoke: true
    secrets:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}

  migrate-database:
    needs: [changes, ci]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (needs.ci.result == 'success' &&
       needs.changes.result == 'success' &&
       needs.changes.outputs.database == 'true')
    uses: ./.github/workflows/apply-migrations.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-functions:
    needs: [changes, ci, migrate-database]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (needs.ci.result == 'success' &&
       needs.changes.result == 'success' &&
       (needs.migrate-database.result == 'success' ||
        (needs.migrate-database.result == 'skipped' &&
         needs.changes.outputs.database == 'false')) &&
       needs.changes.outputs.functions == 'true')
    uses: ./.github/workflows/deploy-functions.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      EXTRA_ALLOWED_ORIGINS: ${{ secrets.EXTRA_ALLOWED_ORIGINS }}

  deploy-frontend:
    needs: [changes, ci, migrate-database, deploy-functions]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (always() &&
       needs.ci.result == 'success' &&
       needs.changes.result == 'success' &&
       (needs.migrate-database.result == 'success' ||
        (needs.migrate-database.result == 'skipped' &&
         needs.changes.outputs.database == 'false')) &&
       needs.changes.outputs.frontend == 'true' &&
       ((needs.changes.outputs.functions == 'true' &&
         needs.deploy-functions.result == 'success') ||
        (needs.changes.outputs.functions == 'false' &&
         needs.deploy-functions.result == 'skipped')))
    uses: ./.github/workflows/deploy-frontend.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
